events {}

http {
    # Grupo de servidores (por defecto reparte en round robin)
    upstream api_servidores {
        server servidor1:8000;
        server servidor2:8000;
        server servidor3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_servidores;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
